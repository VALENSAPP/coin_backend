<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Valens New Order</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            color: #333333;
        }

        .email-container {
            max-width: 600px;
            margin: 40px auto;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
            padding: 30px 40px;
        }

        .header {
            text-align: center;
        }

        .logo {
            width: 220px;
            max-width: 100%;
            height: auto;
        }

        .divider {
            border-top: 4px dotted #b999f3;
            margin: 0 0 25px 0;
        }

        .content {
            font-size: 15px;
            line-height: 1.6;
            color: #333333;
        }

        .order-box {
            border-radius: 8px;
            padding: 16px 20px;
            margin: 20px 0;
            background-color: #f7f2fd;
        }

        .order-box p {
            margin: 4px 0;
        }

        .footer {
            font-size: 13px;
            color: #666666;
            text-align: left;
            margin-top: 20px;
        }

        img.header-img {
            width: 100%;
            max-width: 500px;
            margin: auto;
        }
    </style>
</head>

<body>
    <div class="email-container">
        <div class="header">
            <img class="header-img"
                src="https://valens520.s3.us-east-2.amazonaws.com/post-images/2d2627c2-bdaa-4523-a304-48a6459892f4.png"
                alt="">
        </div>

        <div class="divider"></div>

        <div class="content">
            <p>Hi <strong>{{seller_name}}</strong>,</p>
            <p>
                Great news! <strong>{{buyer_name}}</strong> just placed a new order in your closet.
            </p>

            <div class="order-box">
                <p><strong>Order Number:</strong> {{order_number}}</p>
                <p><strong>Item:</strong> {{product_name}}</p>
                <p><strong>Total:</strong> {{order_total}}</p>
            </div>

            <p>
                Please prepare the item for shipping/pickup as soon as possible.
            </p>

            <p class="footer">
                Valens Technologies Inc.
            </p>
        </div>
    </div>
</body>

</html>
